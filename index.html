<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    font-family: Arial, sans-serif;
}

.player {
    position: relative;
    width: 100%;
    max-width: 1200px;
    margin: auto;
    background: #000;
    overflow: hidden;
}

video {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    object-fit: contain;
}

.topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 12px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(#000b, transparent);
    color: white;
    z-index: 5;
}

.title {
    font-weight: 700;
    font-size: 15px;
}

.live {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
}

.live-dot {
    width: 8px;
    height: 8px;
    background: red;
    border-radius: 50%;
}

.controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(transparent, #000d);
    z-index: 5;
}

button, select {
    background: #181818;
    color: white;
    border: 0;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
}

button {
    cursor: pointer;
}

.spacer {
    flex: 1;
}

.status {
    color: #ccc;
    font-size: 12px;
}

.loader {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: white;
    background: #0006;
    z-index: 4;
}

.loader.show {
    display: flex;
}

@media (max-width: 600px) {
    .controls {
        padding: 7px;
        gap: 5px;
    }

    button, select {
        padding: 6px 7px;
        font-size: 11px;
    }

    .title {
        font-size: 13px;
    }
}
</style>
</head>

/* -----------------------------
   PLAY / PAUSE
----------------------------- */

playBtn.onclick = function() {

    if (video.paused) {

        video.play();

        playBtn.textContent = "⏸";

    } else {

        video.pause();

        playBtn.textContent = "▶";

    }

};


/* -----------------------------
   MUTE
----------------------------- */

muteBtn.onclick = function() {

    video.muted = !video.muted;

    muteBtn.textContent =
        video.muted ? "🔇" : "🔊";

};


/* -----------------------------
   QUALITY
----------------------------- */

quality.onchange = function() {

    if (!hls) return;

    const selected = parseInt(
        quality.value
    );

    hls.currentLevel = selected;

};


/* -----------------------------
   FULLSCREEN
----------------------------- */

fullscreenBtn.onclick = function() {

    if (!document.fullscreenElement) {

        player.requestFullscreen();

    } else {

        document.exitFullscreen();

    }

};


/* -----------------------------
   LOADING
----------------------------- */

video.addEventListener("waiting", function() {

    loader.classList.add("show");

});

video.addEventListener("playing", function() {

    loader.classList.remove("show");

    statusText.textContent = "LIVE";

    playBtn.textContent = "⏸";

});


/* -----------------------------
   START
----------------------------- */

video.addEventListener("loadedmetadata", function() {

    video.play().catch(() => {});

});

</script>
