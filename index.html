<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Live Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

.player{
    position:relative;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    user-select:none;
}

video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

/* DARK GRADIENTS */

.topShade{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:90px;
    background:linear-gradient(#0009,transparent);
    opacity:0;
    transition:.25s;
    pointer-events:none;
}

.bottomShade{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:125px;
    background:linear-gradient(transparent,#000d);
    opacity:0;
    transition:.25s;
    pointer-events:none;
}

.controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:0 13px 10px;
    opacity:0;
    transform:translateY(8px);
    transition:.25s;
    pointer-events:none;
}

.visible .controls{
    opacity:1;
    transform:none;
    pointer-events:auto;
}

.visible .topShade,
.visible .bottomShade{
    opacity:1;
}

/* PROGRESS */

.progress{
    position:relative;
    width:100%;
    height:4px;
    background:#ffffff55;
    cursor:pointer;
    margin-bottom:10px;
    border-radius:5px;
}

.progress:hover{
    height:6px;
}

.buffer{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    width:0;
    background:#ffffff66;
    border-radius:5px;
}

.progressFill{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    width:0;
    background:#ff0033;
    border-radius:5px;
}

.progressDot{
    position:absolute;
    width:11px;
    height:11px;
    border-radius:50%;
    background:#ff0033;
    top:50%;
    left:0;
    transform:translate(-50%,-50%);
    opacity:0;
}

.progress:hover .progressDot{
    opacity:1;
}

/* CONTROL ROW */

.row{
    display:flex;
    align-items:center;
    gap:5px;
}

button{
    border:0;
    background:transparent;
    color:#fff;
    width:39px;
    height:39px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
    cursor:pointer;
    font-size:19px;
}

button:active{
    background:#ffffff20;
}

.spacer{
    flex:1;
}

/* VOLUME */

.volumeBox{
    display:flex;
    align-items:center;
}

.volumeRange{
    width:0;
    opacity:0;
    transition:.2s;
    accent-color:#fff;
}

.volumeBox:hover .volumeRange{
    width:75px;
    opacity:1;
}

/* LIVE */

.live{
    display:flex;
    align-items:center;
    gap:6px;
    color:#fff;
    font-size:12px;
    font-weight:bold;
    margin-right:5px;
}

.dot{
    width:7px;
    height:7px;
    background:#ff0033;
    border-radius:50%;
}

/* SETTINGS */

.settings{
    position:absolute;
    right:50px;
    bottom:58px;
    width:min(310px, calc(100vw - 28px));
    background:#181818f5;
    border-radius:10px;
    padding:7px;
    display:none;
    color:#fff;
    box-shadow:0 5px 25px #000;
}

.settings.show{
    display:block;
}

.menuTitle{
    padding:10px;
    font-size:13px;
    color:#aaa;
}

.menuItem{
    padding:11px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
}

.menuItem:hover{
    background:#ffffff15;
}

/* SEEK CONTROLS + DOUBLE-TAP FEEDBACK */
.seekButton{font-size:14px;gap:2px;white-space:nowrap;width:48px;font-weight:600;}
.timeDisplay{color:#fff;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 4px;opacity:.92;}
.seekFeedback{position:absolute;top:50%;transform:translateY(-50%);width:112px;height:112px;border-radius:50%;background:#0009;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:5px;pointer-events:none;z-index:5;font-size:25px;}
.seekFeedback small{font-size:12px;font-weight:600;}
.seekFeedback.left{left:14%;}
.seekFeedback.right{right:14%;}
.seekFeedback.show{display:flex;animation:seekPop .45s ease-out;}
@keyframes seekPop{0%{opacity:.25;transform:translateY(-50%) scale(.82)}35%{opacity:1;transform:translateY(-50%) scale(1)}100%{opacity:.95;transform:translateY(-50%) scale(1)}}
@media(max-width:600px){.seekButton{width:42px;font-size:12px}.timeDisplay{font-size:10px;padding:0 2px}.seekFeedback{width:82px;height:82px}.seekFeedback.left{left:8%}.seekFeedback.right{right:8%}}

/* CENTER */

.centerPlay{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:72px;
    height:72px;
    border-radius:50%;
    border:0;
    background:#ffffffdd;
    color:#111;
    font-size:28px;
    display:none;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 20px #0008;
}

.centerPlay.show{
    display:flex;
}

/* LOADER */

.loader{
    position:absolute;
    left:50%;
    top:50%;
    width:42px;
    height:42px;
    margin:-21px;
    border:4px solid #ffffff35;
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:none;
}

.loader.show{
    display:block;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* QUALITY */

.quality{
    width:100%;
    padding:10px;
    background:#222;
    color:#fff;
    border:0;
    border-radius:6px;
    outline:none;
}

/* ASPECT RATIO + GESTURE HUD */
.settings{max-height:calc(100% - 90px);overflow-y:auto;overscroll-behavior:contain;}
.gestureHud{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;display:none;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:#000c;color:#fff;font-size:14px;font-weight:600;pointer-events:none;white-space:nowrap;}
.gestureHud.show{display:flex;}
#pipBtn{font-size:17px;}
@media(max-width:600px){

    .controls{
        padding:0 7px 7px;
    }

    button{
        width:35px;
        height:35px;
        font-size:17px;
    }

    .live{
        font-size:10px;
    }

    .settings{
        right:7px;
        bottom:48px;
        width:min(310px, calc(100vw - 14px));
    }

    .volumeRange{
        display:none;
    }
}
</style>
</head>

<body>

<div class="player" id="player">

<video id="video" playsinline></video>
<div class="seekFeedback left" id="seekFeedbackLeft" aria-hidden="true">↺ <small>10 seconds</small></div>
<div class="seekFeedback right" id="seekFeedbackRight" aria-hidden="true">↻ <small>10 seconds</small></div>

<div class="topShade"></div>
<div class="bottomShade"></div>

<div class="loader" id="loader"></div>
<div class="gestureHud" id="gestureHud" aria-live="polite"></div>

<button class="centerPlay" id="centerPlay">▶</button>

<div class="settings" id="settings">

    <div class="menuTitle">Video / Stream URL</div>
    <input id="streamUrlInput" type="url" placeholder="Paste video or stream URL"
      style="width:100%;padding:10px;background:#222;color:#fff;border:1px solid #444;border-radius:6px;margin-bottom:7px;box-sizing:border-box;">
    <select id="streamType" class="quality" style="margin-bottom:7px;">
      <option value="auto">Auto detect</option>
      <option value="hls">HLS / M3U8</option>
      <option value="dash">DASH / MPD</option>
      <option value="file">Direct media (MP4/MKV/etc.)</option>
      <option value="embed">Embed player page</option>
    </select>
    <button id="loadStreamBtn" style="width:100%;height:38px;background:#ff0033;border-radius:6px;font-size:14px;margin-bottom:10px;">Load URL</button>

    <div class="menuTitle">Quality</div>

    <select class="quality" id="quality" aria-label="Playback quality">
        <option value="-1">Auto</option>
    </select>

    <div class="menuTitle">Aspect ratio</div>
    <select class="quality" id="aspectRatio" aria-label="Aspect ratio">
        <option value="fit">Fit (original ratio)</option>
        <option value="fill">Fill screen</option>
        <option value="zoom">Zoom 1.25×</option>
    </select>

    <div class="menuTitle">Playback speed</div>

    <div class="menuItem" data-speed="1">Normal</div>
    <div class="menuItem" data-speed="1.25">1.25×</div>
    <div class="menuItem" data-speed="1.5">1.5×</div>
    <div class="menuItem" data-speed="2">2×</div>

</div>

<div class="controls">

    <div class="progress" id="progress">

        <div class="buffer" id="buffer"></div>

        <div class="progressFill" id="progressFill"></div>

        <div class="progressDot" id="progressDot"></div>

    </div>

    <div class="row">

        <button id="play" aria-label="Play or pause">▶</button>
        <button id="skipBack" class="seekButton" aria-label="Go back 10 seconds" title="Back 10 seconds">↺10</button>
        <button id="skipForward" class="seekButton" aria-label="Forward 10 seconds" title="Forward 10 seconds">10↻</button>
        <span class="timeDisplay" id="timeDisplay">0:00 / 0:00</span>

        <div class="volumeBox">

            <button id="mute">🔊</button>

            <input
                class="volumeRange"
                id="volume"
                type="range"
                min="0"
                max="1"
                step=".01"
                value="1">

        </div>

        <span class="spacer"></span>

        <div class="live">
            <span class="dot"></span>
            LIVE
        </div>

        <button id="pipBtn" aria-label="Picture in picture" title="Picture-in-Picture">▣</button>
        <button id="settingsBtn" aria-label="Settings">⚙</button>
        <button id="fullscreen" aria-label="Fullscreen">⛶</button>

    </div>

</div>

</div>

<script>

/* =========================================
   PUT YOUR AUTHORIZED MASTER HLS URL HERE
========================================= */

const STREAM_URL =
"https://moon.zenoak.top/vd/MVBlT1FpcVREYlgwdzc1LUNVN3FjZzpaUG1QWDQ5VXU4QlBNUFJ3R2pkRjdVV0Y1bG9BUkZGbDRlZzRWbHZTM1BB/index-s2160p-v1-a1.m3u8";


const player =
document.getElementById("player");

const video =
document.getElementById("video");

const loader =
document.getElementById("loader");

const centerPlay =
document.getElementById("centerPlay");

const play =
document.getElementById("play");

const mute =
document.getElementById("mute");

const volume =
document.getElementById("volume");

const fullscreen =
document.getElementById("fullscreen");

const settingsBtn =
document.getElementById("settingsBtn");

const settings =
document.getElementById("settings");

const quality =
document.getElementById("quality");

const progress =
document.getElementById("progress");

const progressFill =
document.getElementById("progressFill");

const progressDot =
document.getElementById("progressDot");

const buffer =
document.getElementById("buffer");
const pipBtn = document.getElementById("pipBtn");
const aspectRatio = document.getElementById("aspectRatio");
const gestureHud = document.getElementById("gestureHud");
const skipBack = document.getElementById("skipBack");
const skipForward = document.getElementById("skipForward");
const timeDisplay = document.getElementById("timeDisplay");
const seekFeedbackLeft = document.getElementById("seekFeedbackLeft");
const seekFeedbackRight = document.getElementById("seekFeedbackRight");
let seekFeedbackTimer = null;
let lastTapTime = 0;
let lastTapX = 0;
let pendingSingleTap = null;
let gestureHudTimer = null;
let gestureState = null;
let suppressTapUntil = 0;
let currentBrightness = 1;
let dashVideoRepresentations = [];

let hls=null;
let hideTimer=null;


/* =========================================
   SHOW / HIDE CONTROLS
========================================= */

function showControls(){

    player.classList.add("visible");

    clearTimeout(hideTimer);

    hideTimer=setTimeout(()=>{

        if(!video.paused){
            player.classList.remove("visible");
            settings.classList.remove("show");
        }

    },5000);
}


function hideControls(){

    player.classList.remove("visible");

    settings.classList.remove("show");

    clearTimeout(hideTimer);
}


/* =========================================
   HLS
========================================= */

let dash = null;
let currentUrl = STREAM_URL;
let activeKind = "hls";

const streamUrlInput = document.getElementById("streamUrlInput");
const streamTypeInput = document.getElementById("streamType");
const loadStreamBtn = document.getElementById("loadStreamBtn");

function getKind(url, requested) {
    // Respect a manual selection; otherwise detect common streaming manifests.
    if (requested && requested !== "auto") return requested;
    let parsed;
    try { parsed = new URL(url); } catch (_) { return "file"; }

    const host = parsed.hostname.toLowerCase().replace(/^www\./, "");
    const path = parsed.pathname.toLowerCase();
    const whole = (parsed.pathname + parsed.search).toLowerCase();

    // Video-host pages need their official embedded player rather than <video src>.
    if (host === "youtu.be" || host === "youtube.com" || host.endsWith(".youtube.com") ||
        host === "vimeo.com" || host.endsWith(".vimeo.com")) return "embed";

    // Manifest URLs may contain query parameters/tokens, so do not rely only on the extension.
    if (/\.m3u8(?:$|[?&/])/.test(whole) || /(?:format|type|output)=hls\b/.test(whole)) return "hls";
    if (/\.mpd(?:$|[?&/])/.test(whole) || /(?:format|type|output)=dash\b/.test(whole)) return "dash";

    // Common direct-media containers. The browser still decides whether its codecs can decode them.
    if (/\.(mp4|m4v|mkv|webm|ogv|ogg|mov|avi|wmv|flv|f4v|3gp|3g2|mpg|mpeg|m2v|ts|m2ts|mts|vob|asf|mxf|rm|rmvb|divx)(?:$|[?&/])/.test(whole)) return "file";

    // Unknown URLs are attempted as direct media; use the dropdown to force HLS/DASH/embed if needed.
    return "file";
}

function getEmbedUrl(raw) {
    let u;
    try { u = new URL(raw); } catch (_) { return raw; }
    const host = u.hostname.toLowerCase().replace(/^www\./, "");
    if (host === "youtu.be") {
        const id = u.pathname.split("/").filter(Boolean)[0];
        if (id) return "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id);
    }
    if (host.endsWith("youtube.com")) {
        if (u.pathname.startsWith("/embed/")) return u.href;
        const id = u.searchParams.get("v") ||
          (u.pathname.startsWith("/shorts/") ? u.pathname.split("/")[2] : "");
        if (id) return "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id);
    }
    if (host.endsWith("vimeo.com")) {
        const id = u.pathname.split("/").filter(Boolean).find(x => /^\d+$/.test(x));
        if (id) return "https://player.vimeo.com/video/" + id;
    }
    return raw;
}

function clearPlayback() {
    if (hls) { try { hls.destroy(); } catch (_) {} hls = null; }
    if (dash) { try { dash.reset(); } catch (_) {} dash = null; }
    video.pause();
    video.removeAttribute("src");
    video.load();
    const oldFrame = player.querySelector("iframe");
    if (oldFrame) oldFrame.remove();
    video.style.display = "";
    quality.innerHTML = '<option value="-1">Auto</option>';
}

function showPlaybackError(message) {
    loader.classList.remove("show");
    centerPlay.classList.add("show");
    console.warn(message);
    alert(message);
}

function start(url = currentUrl, requestedKind = "auto") {
    if (!url || !String(url).trim()) {
        showPlaybackError("Paste a video or stream URL first.");
        return;
    }
    url = String(url).trim();
    let parsed;
    try { parsed = new URL(url); } catch (_) {
        showPlaybackError("Please enter a complete URL starting with https:// or http://");
        return;
    }
    if (!["http:", "https:"].includes(parsed.protocol)) {
        showPlaybackError("Only HTTP/HTTPS stream URLs can be loaded in this web player.");
        return;
    }

    savePlaybackPosition();
    currentUrl = url;
    activeKind = getKind(url, requestedKind);
    clearPlayback();
    loader.classList.add("show");
    centerPlay.classList.remove("show");

    if (activeKind === "embed") {
        pipBtn.disabled = true;
        pipBtn.style.opacity = ".4";
        pipBtn.title = "Picture-in-Picture is unavailable for this embedded page";
        video.style.display = "none";
        const frame = document.createElement("iframe");
        frame.src = getEmbedUrl(url);
        frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
        frame.allowFullscreen = true;
        frame.title = "Embedded video";
        frame.style.cssText = "position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;";
        player.insertBefore(frame, player.querySelector(".topShade"));
        loader.classList.remove("show");
        showControls();
        return;
    }

    video.style.display = "";
    pipBtn.disabled = !(document.pictureInPictureEnabled && video.requestPictureInPicture);
    pipBtn.style.opacity = pipBtn.disabled ? ".4" : "1";
    pipBtn.title = pipBtn.disabled ? "Picture-in-Picture is not supported by this browser" : "Picture-in-Picture";
    video.controls = false;

    if (activeKind === "hls") {
        if (video.canPlayType("application/vnd.apple.mpegurl")) {
            video.src = url;
            video.addEventListener("loadedmetadata", onMetadata, {once:true});
            video.addEventListener("error", () => showPlaybackError("HLS playback failed. Check stream URL, CORS, expiry, or access restrictions."), {once:true});
            video.load();
        } else if (window.Hls && Hls.isSupported()) {
            hls = new Hls({enableWorker:true, lowLatencyMode:true, backBufferLength:30});
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                loader.classList.remove("show");
                createQualityList();
                restorePlaybackPosition();
                video.play().catch(() => { centerPlay.classList.add("show"); showControls(); });
            });
            hls.on(Hls.Events.ERROR, (_, data) => {
                if (data.fatal) showPlaybackError("HLS error. The stream may be blocked by CORS, expired, private, or unavailable.");
            });
        } else {
            showPlaybackError("This browser does not support HLS playback.");
        }
        return;
    }

    if (activeKind === "dash") {
        if (window.dashjs && dashjs.supportsMediaSource()) {
            dash = dashjs.MediaPlayer().create();
            dash.initialize(video, url, false);
            dash.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, () => {
                loader.classList.remove("show");
                createDashQualityList();
                video.play().catch(() => { centerPlay.classList.add("show"); showControls(); });
            });
            dash.on(dashjs.MediaPlayer.events.ERROR, () => showPlaybackError("DASH playback failed. Check URL, CORS, and stream access."));
        } else {
            showPlaybackError("MPEG-DASH is not supported in this browser.");
        }
        return;
    }

    // Try any direct media URL (MP4, MKV, WebM, MOV, AVI, 3GP, MPEG, TS, VOB, WMV, FLV, etc.). Actual playback depends on browser codecs.
    video.src = url;
    video.addEventListener("loadedmetadata", onMetadata, {once:true});
    video.addEventListener("error", () => {
        const ext = (parsed.pathname.split(".").pop() || "").toLowerCase();
        const extra = ["mkv","avi","wmv","flv","mov","ts","m2ts","mts","vob","asf","mxf","rm","rmvb","divx","mpg","mpeg","3gp","3g2","f4v"].includes(ext)
          ? " This container or its codec may not be supported by the browser. A server-side converter/remuxer can expand compatibility, but needs a separate backend."
          : "";
        showPlaybackError("Direct playback failed. The URL may be blocked/expired, or the browser may not support its codec." + extra);
    }, {once:true});
    video.load();
}

function onMetadata() {
    loader.classList.remove("show");
    restorePlaybackPosition();
    video.play().catch(() => { centerPlay.classList.add("show"); showControls(); });
}

loadStreamBtn.addEventListener("click", e => {
    e.stopPropagation();
    const val = streamUrlInput.value.trim();
    start(val, streamTypeInput.value);
    settings.classList.remove("show");
});
streamUrlInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        e.preventDefault();
        start(streamUrlInput.value.trim(), streamTypeInput.value);
        settings.classList.remove("show");
    }
});

// Allow sharing/deep-linking a URL as ?url=https%3A%2F%2F...&type=auto
try {
    const params = new URLSearchParams(location.search);
    const supplied = params.get("url");
    const suppliedType = params.get("type") || "auto";
    if (supplied) {
        currentUrl = supplied;
        streamUrlInput.value = supplied;
        streamTypeInput.value = suppliedType;
    } else {
        streamUrlInput.value = STREAM_URL;
    }
} catch (_) {
    streamUrlInput.value = STREAM_URL;
}

/* =========================================
   QUALITY LIST
========================================= */

function createQualityList(){

    quality.innerHTML =
        '<option value="-1">Auto</option>';


    if(!hls || !hls.levels.length){
        return;
    }


    hls.levels.forEach(
        (level,index)=>{

            const option =
                document.createElement("option");

            option.value=index;

            option.textContent =
                level.height
                ? level.height+"p"
                : "Quality "+(index+1);

            quality.appendChild(option);

        }
    );
}

function createDashQualityList() {
    quality.innerHTML = '<option value="-1">Auto</option>';
    dashVideoRepresentations = [];
    if (!dash || typeof dash.getBitrateInfoListFor !== "function") return;
    try { dashVideoRepresentations = dash.getBitrateInfoListFor("video") || []; } catch (_) { return; }
    dashVideoRepresentations.forEach((rep, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        const height = rep.height ? `${rep.height}p` : `Quality ${index + 1}`;
        const bitrate = rep.bitrate ? ` · ${(rep.bitrate / 1000).toFixed(0)} kbps` : "";
        option.textContent = height + bitrate;
        quality.appendChild(option);
    });
}

/* =========================================
   QUALITY CHANGE
========================================= */

quality.addEventListener(
    "change",
    e=>{

        const selected = Number(e.target.value);
        if (hls) {
            hls.currentLevel = selected;
        } else if (dash && typeof dash.setQualityFor === "function") {
            try {
                dash.setAutoSwitchQualityFor("video", selected === -1);
                if (selected >= 0) dash.setQualityFor("video", selected);
            } catch (err) { console.warn("Could not change DASH quality", err); }
        }
        showControls();

    }
);


/* =========================================
   PICTURE-IN-PICTURE + ASPECT RATIO
========================================= */
pipBtn.addEventListener("click", async e => {
    e.stopPropagation();
    try {
        if (!document.pictureInPictureEnabled || !video.requestPictureInPicture) {
            showPlaybackError("Picture-in-Picture is not supported for this video/browser.");
            return;
        }
        if (document.pictureInPictureElement === video) await document.exitPictureInPicture();
        else await video.requestPictureInPicture();
    } catch (err) {
        showPlaybackError("Picture-in-Picture could not start. Try playing the video first or check browser support.");
    }
    showControls();
});

function applyAspectRatio(mode) {
    video.style.transform = "none";
    video.style.objectFit = "contain";
    if (mode === "fill") video.style.objectFit = "cover";
    if (mode === "zoom") {
        video.style.objectFit = "contain";
        video.style.transform = "scale(1.25)";
    }
}
aspectRatio.addEventListener("change", () => {
    applyAspectRatio(aspectRatio.value);
    showControls();
});

/* =========================================
   RESUME PLAYBACK
========================================= */
function positionStorageKey(url = currentUrl) {
    // Short stable key so very long signed stream URLs do not become oversized storage keys.
    let hash = 2166136261;
    const value = String(url || "");
    for (let i = 0; i < value.length; i++) {
        hash ^= value.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
    }
    return "proPlayerPosition:" + (hash >>> 0).toString(16);
}

function savePlaybackPosition() {
    try {
        if (!currentUrl || !Number.isFinite(video.currentTime) || video.currentTime < 5) return;
        if (!Number.isFinite(video.duration) || video.duration <= 0) return; // Do not persist live/DVR positions.
        if (video.currentTime >= video.duration - 3) {
            localStorage.removeItem(positionStorageKey());
            return;
        }
        localStorage.setItem(positionStorageKey(), JSON.stringify({
            time: video.currentTime,
            duration: video.duration,
            savedAt: Date.now()
        }));
    } catch (_) { /* Storage may be disabled; playback still works. */ }
}

function restorePlaybackPosition() {
    try {
        if (!currentUrl || !Number.isFinite(video.duration) || video.duration <= 0) return;
        const raw = localStorage.getItem(positionStorageKey());
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (!saved || !Number.isFinite(saved.time) || saved.time < 5) return;
        // Only restore if duration is reasonably similar, avoiding stale positions for changed content.
        if (Number.isFinite(saved.duration) && Math.abs(saved.duration - video.duration) > Math.max(120, video.duration * 0.08)) return;
        if (saved.time >= video.duration - 3) return;
        video.currentTime = Math.min(saved.time, video.duration - 1);
        showResumeNotice(saved.time);
    } catch (_) { /* Storage may be disabled or this stream may not be seekable. */ }
}

function showResumeNotice(seconds) {
    showGestureHud(`▶ Resume from ${formatTime(seconds)}`);
}

video.addEventListener("timeupdate", savePlaybackPosition);
window.addEventListener("pagehide", savePlaybackPosition);
window.addEventListener("beforeunload", savePlaybackPosition);

/* =========================================
   TOUCH BRIGHTNESS / VOLUME GESTURES
   Swipe vertically on left side for brightness, right side for volume.
========================================= */
function showGestureHud(message) {
    gestureHud.textContent = message;
    gestureHud.classList.add("show");
    clearTimeout(gestureHudTimer);
    gestureHudTimer = setTimeout(() => gestureHud.classList.remove("show"), 900);
}

video.addEventListener("touchstart", e => {
    if (!e.touches || e.touches.length !== 1) return;
    const t = e.touches[0];
    const rect = video.getBoundingClientRect();
    gestureState = {
        startX: t.clientX, startY: t.clientY,
        lastY: t.clientY, width: rect.width,
        side: t.clientX < rect.left + rect.width / 2 ? "brightness" : "volume",
        startBrightness: currentBrightness,
        startVolume: video.muted ? 0 : video.volume,
        moved: false
    };
}, {passive:true});

video.addEventListener("touchmove", e => {
    if (!gestureState || !e.touches || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dy = gestureState.startY - t.clientY;
    if (Math.abs(dy) < 12 && !gestureState.moved) return;
    gestureState.moved = true;
    suppressTapUntil = Date.now() + 500;
    clearTimeout(pendingSingleTap);
    pendingSingleTap = null;
    const change = dy / Math.max(160, gestureState.width) * 1.4;
    if (gestureState.side === "brightness") {
        currentBrightness = Math.max(0.35, Math.min(1.5, gestureState.startBrightness + change));
        video.style.filter = `brightness(${currentBrightness})`;
        showGestureHud(`☀ Brightness ${Math.round(currentBrightness * 100)}%`);
    } else {
        const nextVolume = Math.max(0, Math.min(1, gestureState.startVolume + change));
        video.volume = nextVolume;
        video.muted = nextVolume === 0;
        mute.textContent = video.muted ? "🔇" : "🔊";
        volume.value = String(nextVolume);
        showGestureHud(`🔊 Volume ${Math.round(nextVolume * 100)}%`);
    }
}, {passive:true});

video.addEventListener("touchend", () => {
    if (gestureState && gestureState.moved) {
        suppressTapUntil = Date.now() + 500;
        showControls();
    }
    gestureState = null;
}, {passive:true});

/* =========================================
   SEEK HELPERS
========================================= */
function formatTime(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) return "LIVE";
    const whole = Math.floor(seconds);
    const h = Math.floor(whole / 3600);
    const m = Math.floor((whole % 3600) / 60);
    const sec = whole % 60;
    return h > 0 ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}` : `${m}:${String(sec).padStart(2,"0")}`;
}

function seekBy(delta) {
    // Live streams may expose only a short seekable DVR window; use it when available.
    let min = 0;
    let max = Number.isFinite(video.duration) ? video.duration : NaN;
    if (video.seekable && video.seekable.length) {
        min = video.seekable.start(0);
        max = video.seekable.end(video.seekable.length - 1);
    }
    if (!Number.isFinite(max) || max <= min) return;
    const target = Math.max(min, Math.min(max, (Number.isFinite(video.currentTime) ? video.currentTime : min) + delta));
    try { video.currentTime = target; } catch (_) { return; }
    showSeekFeedback(delta < 0 ? "left" : "right", Math.abs(delta));
    showControls();
}

function showSeekFeedback(side, seconds) {
    const el = side === "left" ? seekFeedbackLeft : seekFeedbackRight;
    const other = side === "left" ? seekFeedbackRight : seekFeedbackLeft;
    other.classList.remove("show");
    el.innerHTML = `${side === "left" ? "↺" : "↻"}<small>${seconds} seconds</small>`;
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
    clearTimeout(seekFeedbackTimer);
    seekFeedbackTimer = setTimeout(() => {
        seekFeedbackLeft.classList.remove("show");
        seekFeedbackRight.classList.remove("show");
    }, 650);
}

skipBack.addEventListener("click", e => { e.stopPropagation(); seekBy(-10); });
skipForward.addEventListener("click", e => { e.stopPropagation(); seekBy(10); });

/* =========================================
   PLAY
========================================= */

function togglePlay(){

    if(video.paused){

        video.play();

    }else{

        video.pause();

    }
}


play.onclick=e=>{

    e.stopPropagation();

    togglePlay();

    showControls();

};


centerPlay.onclick=e=>{

    e.stopPropagation();

    togglePlay();

};


video.addEventListener(
    "play",
    ()=>{

        play.textContent="⏸";

        centerPlay.classList.remove("show");

        showControls();

    }
);


video.addEventListener(
    "pause",
    ()=>{

        play.textContent="▶";

        centerPlay.classList.add("show");

        showControls();

    }
);


/* =========================================
   MUTE
========================================= */

mute.onclick=e=>{

    e.stopPropagation();

    video.muted=!video.muted;

    mute.textContent =
        video.muted ? "🔇" : "🔊";

    showControls();

};


volume.oninput=()=>{

    video.volume=
        Number(volume.value);

    video.muted=
        video.volume===0;

    mute.textContent=
        video.muted ? "🔇" : "🔊";

};


/* =========================================
   SETTINGS
========================================= */

settingsBtn.onclick=e=>{

    e.stopPropagation();

    settings.classList.toggle("show");

    showControls();

};


document.querySelectorAll(
    ".menuItem"
).forEach(item=>{

    item.onclick=()=>{

        video.playbackRate =
            Number(item.dataset.speed);

        settings.classList.remove("show");

        showControls();

    };

});


/* =========================================
   FULLSCREEN
========================================= */

fullscreen.onclick=e=>{

    e.stopPropagation();

    if(!document.fullscreenElement){

        player.requestFullscreen();

    }else{

        document.exitFullscreen();

    }

    showControls();

};


/* =========================================
   PROGRESS / SEEK
========================================= */

video.addEventListener(
    "timeupdate",
    ()=>{

        if(!video.duration) return;

        const percent =
            (video.currentTime /
             video.duration)*100;

        progressFill.style.width =
            percent+"%";

        progressDot.style.left =
            percent+"%";
        if (timeDisplay) timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;

    }
);


progress.addEventListener(
    "click",
    e=>{

        if(!video.duration) return;

        const rect =
            progress.getBoundingClientRect();

        const percent =
            (e.clientX-rect.left) /
            rect.width;

        video.currentTime =
            percent*video.duration;

        showControls();

    }
);


/* =========================================
   BUFFER
========================================= */

video.addEventListener("loadedmetadata", () => {
    if (timeDisplay) timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
});
video.addEventListener("durationchange", () => {
    if (timeDisplay) timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
});

video.addEventListener(
    "progress",
    ()=>{

        if(
            video.buffered.length &&
            video.duration
        ){

            const end =
                video.buffered.end(
                    video.buffered.length-1
                );

            buffer.style.width =
                (end/video.duration*100)+"%";

        }

    }
);


/* =========================================
   LOADING
========================================= */

video.addEventListener(
    "waiting",
    ()=>{
        loader.classList.add("show");
    }
);


video.addEventListener(
    "playing",
    ()=>{

        loader.classList.remove("show");

        centerPlay.classList.remove("show");

    }
);


/* =========================================
   TAP VIDEO — DOUBLE TAP TO SEEK 10 SECONDS
========================================= */
player.addEventListener("click", e => {
    if (Date.now() < suppressTapUntil) return;
    if (e.target.closest(".controls") || e.target.closest(".settings") || e.target === centerPlay || e.target.closest(".seekFeedback")) return;
    if (e.target.closest("button")) return;

    const now = Date.now();
    const rect = player.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const isSecondTap = (now - lastTapTime < 320) && (Math.abs(x - lastTapX) < rect.width * 0.28);

    if (isSecondTap) {
        clearTimeout(pendingSingleTap);
        pendingSingleTap = null;
        // Left third rewinds, right third skips forward; center double-tap toggles playback.
        if (x < rect.width / 3) seekBy(-10);
        else if (x > rect.width * 2 / 3) seekBy(10);
        else togglePlay();
        lastTapTime = 0;
        return;
    }

    lastTapTime = now;
    lastTapX = x;
    clearTimeout(pendingSingleTap);
    pendingSingleTap = setTimeout(() => {
        if (player.classList.contains("visible")) hideControls();
        else showControls();
    }, 230);
});

// Keyboard shortcuts when the player is not focused on a text field.
document.addEventListener("keydown", e => {
    if (e.target && (e.target.matches("input, textarea, select") || e.target.isContentEditable)) return;
    if (!player.contains(e.target) && document.activeElement !== document.body) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); seekBy(-10); }
    else if (e.key === "ArrowRight") { e.preventDefault(); seekBy(10); }
    else if (e.key === " " || e.key.toLowerCase() === "k") { e.preventDefault(); togglePlay(); showControls(); }
});


/* =========================================
   MOUSE
========================================= */

player.addEventListener(
    "mousemove",
    showControls
);


/* =========================================
   TOUCH
========================================= */

player.addEventListener(
    "touchstart",
    showControls,
    {passive:true}
);


/* =========================================
   START
========================================= */

applyAspectRatio(aspectRatio.value);
pipBtn.disabled = !(document.pictureInPictureEnabled && video.requestPictureInPicture);
pipBtn.style.opacity = pipBtn.disabled ? ".4" : "1";
start();

</script>
