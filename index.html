<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Live Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

.player{
    position:relative;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    user-select:none;
}

video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

/* DARK GRADIENTS */

.topShade{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:90px;
    background:linear-gradient(#0009,transparent);
    opacity:0;
    transition:.25s;
    pointer-events:none;
}

.bottomShade{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:125px;
    background:linear-gradient(transparent,#000d);
    opacity:0;
    transition:.25s;
    pointer-events:none;
}

.controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:0 13px 10px;
    opacity:0;
    transform:translateY(8px);
    transition:.25s;
    pointer-events:none;
}

.visible .controls{
    opacity:1;
    transform:none;
    pointer-events:auto;
}

.visible .topShade,
.visible .bottomShade{
    opacity:1;
}

/* PROGRESS */

.progress{
    position:relative;
    width:100%;
    height:4px;
    background:#ffffff55;
    cursor:pointer;
    margin-bottom:10px;
    border-radius:5px;
}

.progress:hover{
    height:6px;
}

.buffer{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    width:0;
    background:#ffffff66;
    border-radius:5px;
}

.progressFill{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    width:0;
    background:#ff0033;
    border-radius:5px;
}

.progressDot{
    position:absolute;
    width:11px;
    height:11px;
    border-radius:50%;
    background:#ff0033;
    top:50%;
    left:0;
    transform:translate(-50%,-50%);
    opacity:0;
}

.progress:hover .progressDot{
    opacity:1;
}

/* CONTROL ROW */

.row{
    display:flex;
    align-items:center;
    gap:5px;
}

button{
    border:0;
    background:transparent;
    color:#fff;
    width:39px;
    height:39px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
    cursor:pointer;
    font-size:19px;
}

button:active{
    background:#ffffff20;
}

.spacer{
    flex:1;
}

/* VOLUME */

.volumeBox{
    display:flex;
    align-items:center;
}

.volumeRange{
    width:0;
    opacity:0;
    transition:.2s;
    accent-color:#fff;
}

.volumeBox:hover .volumeRange{
    width:75px;
    opacity:1;
}

/* LIVE */

.live{
    display:flex;
    align-items:center;
    gap:6px;
    color:#fff;
    font-size:12px;
    font-weight:bold;
    margin-right:5px;
}

.dot{
    width:7px;
    height:7px;
    background:#ff0033;
    border-radius:50%;
}

/* SETTINGS */

.settings{
    position:absolute;
    right:50px;
    bottom:58px;
    width:190px;
    background:#181818f5;
    border-radius:10px;
    padding:7px;
    display:none;
    color:#fff;
    box-shadow:0 5px 25px #000;
}

.settings.show{
    display:block;
}

.menuTitle{
    padding:10px;
    font-size:13px;
    color:#aaa;
}

.menuItem{
    padding:11px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
}

.menuItem:hover{
    background:#ffffff15;
}

/* CENTER */

.centerPlay{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:72px;
    height:72px;
    border-radius:50%;
    border:0;
    background:#ffffffdd;
    color:#111;
    font-size:28px;
    display:none;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 20px #0008;
}

.centerPlay.show{
    display:flex;
}

/* LOADER */

.loader{
    position:absolute;
    left:50%;
    top:50%;
    width:42px;
    height:42px;
    margin:-21px;
    border:4px solid #ffffff35;
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:none;
}

.loader.show{
    display:block;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* QUALITY */

.quality{
    width:100%;
    padding:10px;
    background:#222;
    color:#fff;
    border:0;
    border-radius:6px;
    outline:none;
}

/* MOBILE */

@media(max-width:600px){

    .controls{
        padding:0 7px 7px;
    }

    button{
        width:35px;
        height:35px;
        font-size:17px;
    }

    .live{
        font-size:10px;
    }

    .settings{
        right:40px;
        bottom:52px;
        width:170px;
    }

    .volumeRange{
        display:none;
    }
}
</style>
</head>

<body>

<div class="player" id="player">

<video id="video" playsinline></video>

<div class="topShade"></div>
<div class="bottomShade"></div>

<div class="loader" id="loader"></div>

<button class="centerPlay" id="centerPlay">▶</button>

<div class="settings" id="settings">

    <div class="menuTitle">Quality</div>

    <select class="quality" id="quality">
        <option value="-1">Auto</option>
    </select>

    <div class="menuTitle">Playback speed</div>

    <div class="menuItem" data-speed="1">Normal</div>
    <div class="menuItem" data-speed="1.25">1.25×</div>
    <div class="menuItem" data-speed="1.5">1.5×</div>
    <div class="menuItem" data-speed="2">2×</div>

</div>

<div class="controls">

    <div class="progress" id="progress">

        <div class="buffer" id="buffer"></div>

        <div class="progressFill" id="progressFill"></div>

        <div class="progressDot" id="progressDot"></div>

    </div>

    <div class="row">

        <button id="play">▶</button>

        <div class="volumeBox">

            <button id="mute">🔊</button>

            <input
                class="volumeRange"
                id="volume"
                type="range"
                min="0"
                max="1"
                step=".01"
                value="1">

        </div>

        <span class="spacer"></span>

        <div class="live">
            <span class="dot"></span>
            LIVE
        </div>

        <button id="settingsBtn">⚙</button>

        <button id="fullscreen">⛶</button>

    </div>

</div>

</div>

const player =
document.getElementById("player");

const video =
document.getElementById("video");

const loader =
document.getElementById("loader");

const centerPlay =
document.getElementById("centerPlay");

const play =
document.getElementById("play");

const mute =
document.getElementById("mute");

const volume =
document.getElementById("volume");

const fullscreen =
document.getElementById("fullscreen");

const settingsBtn =
document.getElementById("settingsBtn");

const settings =
document.getElementById("settings");

const quality =
document.getElementById("quality");

const progress =
document.getElementById("progress");

const progressFill =
document.getElementById("progressFill");

const progressDot =
document.getElementById("progressDot");

const buffer =
document.getElementById("buffer");


let hls=null;
let hideTimer=null;


/* =========================================
   SHOW / HIDE CONTROLS
========================================= */

function showControls(){

    player.classList.add("visible");

    clearTimeout(hideTimer);

    hideTimer=setTimeout(()=>{

        if(!video.paused){
            player.classList.remove("visible");
            settings.classList.remove("show");
        }

    },5000);
}


function hideControls(){

    player.classList.remove("visible");

    settings.classList.remove("show");

    clearTimeout(hideTimer);
}


/* =========================================
   HLS
========================================= */

function start(){

    loader.classList.add("show");


    if(Hls.isSupported()){

        hls=new Hls({
            enableWorker:true,
            lowLatencyMode:true,
            backBufferLength:30
        });


        hls.loadSource(STREAM_URL);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            ()=>{

                loader.classList.remove("show");

                createQualityList();

                video.play().catch(()=>{

                    centerPlay.classList.add("show");

                    showControls();

                });

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (event,data)=>{

                if(data.fatal){

                    loader.classList.add("show");

                    setTimeout(()=>{

                        if(hls){
                            hls.destroy();
                        }

                        start();

                    },3000);

                }

            }
        );

    }

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src=STREAM_URL;

        video.addEventListener(
            "loadedmetadata",
            ()=>{
                loader.classList.remove("show");

                video.play().catch(()=>{

                    centerPlay.classList.add("show");

                    showControls();

                });

            },
            {once:true}
        );

    }
}


/* =========================================
   QUALITY LIST
========================================= */

function createQualityList(){

    quality.innerHTML =
        '<option value="-1">Auto</option>';


    if(!hls || !hls.levels.length){
        return;
    }


    hls.levels.forEach(
        (level,index)=>{

            const option =
                document.createElement("option");

            option.value=index;

            option.textContent =
                level.height
                ? level.height+"p"
                : "Quality "+(index+1);

            quality.appendChild(option);

        }
    );
}


/* =========================================
   QUALITY CHANGE
========================================= */

quality.addEventListener(
    "change",
    e=>{

        if(hls){

            hls.currentLevel =
                Number(e.target.value);

        }

        showControls();

    }
);


/* =========================================
   PLAY
========================================= */

function togglePlay(){

    if(video.paused){

        video.play();

    }else{

        video.pause();

    }
}


play.onclick=e=>{

    e.stopPropagation();

    togglePlay();

    showControls();

};


centerPlay.onclick=e=>{

    e.stopPropagation();

    togglePlay();

};


video.addEventListener(
    "play",
    ()=>{

        play.textContent="⏸";

        centerPlay.classList.remove("show");

        showControls();

    }
);


video.addEventListener(
    "pause",
    ()=>{

        play.textContent="▶";

        centerPlay.classList.add("show");

        showControls();

    }
);


/* =========================================
   MUTE
========================================= */

mute.onclick=e=>{

    e.stopPropagation();

    video.muted=!video.muted;

    mute.textContent =
        video.muted ? "🔇" : "🔊";

    showControls();

};


volume.oninput=()=>{

    video.volume=
        Number(volume.value);

    video.muted=
        video.volume===0;

    mute.textContent=
        video.muted ? "🔇" : "🔊";

};


/* =========================================
   SETTINGS
========================================= */

settingsBtn.onclick=e=>{

    e.stopPropagation();

    settings.classList.toggle("show");

    showControls();

};


document.querySelectorAll(
    ".menuItem"
).forEach(item=>{

    item.onclick=()=>{

        video.playbackRate =
            Number(item.dataset.speed);

        settings.classList.remove("show");

        showControls();

    };

});


/* =========================================
   FULLSCREEN
========================================= */

fullscreen.onclick=e=>{

    e.stopPropagation();

    if(!document.fullscreenElement){

        player.requestFullscreen();

    }else{

        document.exitFullscreen();

    }

    showControls();

};


/* =========================================
   PROGRESS / SEEK
========================================= */

video.addEventListener(
    "timeupdate",
    ()=>{

        if(!video.duration) return;

        const percent =
            (video.currentTime /
             video.duration)*100;

        progressFill.style.width =
            percent+"%";

        progressDot.style.left =
            percent+"%";

    }
);


progress.addEventListener(
    "click",
    e=>{

        if(!video.duration) return;

        const rect =
            progress.getBoundingClientRect();

        const percent =
            (e.clientX-rect.left) /
            rect.width;

        video.currentTime =
            percent*video.duration;

        showControls();

    }
);


/* =========================================
   BUFFER
========================================= */

video.addEventListener(
    "progress",
    ()=>{

        if(
            video.buffered.length &&
            video.duration
        ){

            const end =
                video.buffered.end(
                    video.buffered.length-1
                );

            buffer.style.width =
                (end/video.duration*100)+"%";

        }

    }
);


/* =========================================
   LOADING
========================================= */

video.addEventListener(
    "waiting",
    ()=>{
        loader.classList.add("show");
    }
);


video.addEventListener(
    "playing",
    ()=>{

        loader.classList.remove("show");

        centerPlay.classList.remove("show");

    }
);


/* =========================================
   TAP VIDEO
========================================= */

player.addEventListener(
    "click",
    e=>{

        if(
            e.target.closest(".controls") ||
            e.target.closest(".settings") ||
            e.target===centerPlay
        ){
            return;
        }

        if(
            player.classList.contains("visible")
        ){

            hideControls();

        }else{

            showControls();

        }

    }
);


/* =========================================
   MOUSE
========================================= */

player.addEventListener(
    "mousemove",
    showControls
);


/* =========================================
   TOUCH
========================================= */

player.addEventListener(
    "touchstart",
    showControls,
    {passive:true}
);


/* =========================================
   START
========================================= */

start();

</script>

</body>
</html>
