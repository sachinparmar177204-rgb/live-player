<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Live Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.player {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: default;
}

video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

/* =========================
   CENTER PLAY BUTTON
========================= */

.center-play {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    width: 68px;
    height: 68px;

    border: 0;
    border-radius: 50%;

    background: rgba(20,20,20,.82);
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 27px;

    cursor: pointer;

    opacity: 0;
    pointer-events: none;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.center-play.show {
    opacity: 1;
    pointer-events: auto;
}

.center-play:active {
    transform: translate(-50%, -50%) scale(.92);
}

/* =========================
   TOP GRADIENT
========================= */

.top-gradient {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    height: 100px;

    background: linear-gradient(
        to bottom,
        rgba(0,0,0,.55),
        transparent
    );

    opacity: 0;

    transition: opacity .25s ease;

    pointer-events: none;
}

/* =========================
   BOTTOM CONTROLS
========================= */

.controls {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        38px 15px 13px;

    background: linear-gradient(
        to top,
        rgba(0,0,0,.85),
        rgba(0,0,0,.35),
        transparent
    );

    display: flex;
    align-items: center;

    gap: 9px;

    opacity: 0;

    transform: translateY(8px);

    transition:
        opacity .25s ease,
        transform .25s ease;

    pointer-events: none;
}

.player.controls-visible .controls {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

.player.controls-visible .top-gradient {
    opacity: 1;
}

/* =========================
   BUTTONS
========================= */

.control-btn {
    width: 38px;
    height: 38px;

    border: 0;
    border-radius: 8px;

    background: rgba(30,30,30,.78);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 17px;

    cursor: pointer;

    transition: background .15s ease;
}

.control-btn:active {
    background: rgba(80,80,80,.85);
}

/* =========================
   QUALITY
========================= */

.quality {
    height: 38px;

    padding: 0 10px;

    border: 0;
    border-radius: 8px;

    background: rgba(30,30,30,.78);

    color: white;

    outline: none;

    font-size: 13px;

    cursor: pointer;
}

/* =========================
   SPACER
========================= */

.spacer {
    flex: 1;
}

/* =========================
   LIVE INDICATOR
========================= */

.live-indicator {
    display: flex;
    align-items: center;
    gap: 6px;

    color: white;

    font-size: 12px;
    font-weight: 700;

    padding: 0 5px;
}

.live-dot {
    width: 7px;
    height: 7px;

    background: #ff2020;

    border-radius: 50%;
}

/* =========================
   LOADING
========================= */

.loader {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 42px;
    height: 42px;

    border: 3px solid rgba(255,255,255,.25);
    border-top-color: white;

    border-radius: 50%;

    animation: spin .75s linear infinite;

    opacity: 0;
    pointer-events: none;

    transition: opacity .2s ease;
}

.loader.show {
    opacity: 1;
}

@keyframes spin {

    to {
        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }

}

/* =========================
   ERROR
========================= */

.error {
    position: absolute;

    left: 50%;
    top: 55%;

    transform: translate(-50%, -50%);

    color: #aaa;

    font-size: 14px;

    text-align: center;

    opacity: 0;

    pointer-events: none;
}

.error.show {
    opacity: 1;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .controls {
        padding:
            35px 9px 9px;

        gap: 5px;
    }

    .control-btn {
        width: 35px;
        height: 35px;

        border-radius: 7px;

        font-size: 15px;
    }

    .quality {
        height: 35px;

        padding: 0 7px;

        font-size: 12px;
    }

    .live-indicator {
        font-size: 10px;
    }

}

/* =========================
   FULLSCREEN
========================= */

.player:fullscreen {
    width: 100vw;
    height: 100vh;
}

.player:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
}

</style>
</head>

<body>

<div class="player" id="player">

    <video
        id="video"
        playsinline
        preload="auto">
    </video>

    <div class="top-gradient"></div>

    <div class="loader" id="loader"></div>

    <div class="error" id="error">
        Stream unavailable
    </div>

    <button
        class="center-play"
        id="centerPlay">
        ▶
    </button>

    <div class="controls" id="controls">

        <button
            class="control-btn"
            id="playBtn">
            ▶
        </button>

        <button
            class="control-btn"
            id="muteBtn">
            🔊
        </button>

        <select
            class="quality"
            id="quality">

            <option value="-1">
                Auto
            </option>

        </select>

        <div class="spacer"></div>

        <div class="live-indicator">
            <span class="live-dot"></span>
            LIVE
        </div>

        <button
            class="control-btn"
            id="fullscreenBtn">
            ⛶
        </button>

    </div>

</div>

let hls = null;

let hideTimer = null;


/* ==================================
   CONTROLS AUTO HIDE
================================== */

function showControls() {

    player.classList.add(
        "controls-visible"
    );

    clearTimeout(hideTimer);

    hideTimer = setTimeout(() => {

        if (!video.paused) {

            player.classList.remove(
                "controls-visible"
            );

        }

    }, 5000);

}


function hideControls() {

    player.classList.remove(
        "controls-visible"
    );

    clearTimeout(hideTimer);

}


/* ==================================
   CLICK / TAP VIDEO
================================== */

player.addEventListener(
    "click",
    function(e) {

        if (
            e.target === playBtn ||
            e.target === muteBtn ||
            e.target === quality ||
            e.target === fullscreenBtn ||
            e.target === centerPlay
        ) {
            return;
        }

        if (
            player.classList.contains(
                "controls-visible"
            )
        ) {

            hideControls();

        } else {

            showControls();

        }

    }
);


/* ==================================
   HLS
================================== */

function startStream() {

    errorBox.classList.remove("show");

    loader.classList.add("show");


    if (Hls.isSupported()) {

        if (hls) {

            hls.destroy();

        }


        hls = new Hls({

            enableWorker: true,

            lowLatencyMode: true,

            backBufferLength: 30

        });


        hls.loadSource(STREAM_URL);

        hls.attachMedia(video);


        /* --------------------------
           STREAM READY
        -------------------------- */

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function() {

                loader.classList.remove(
                    "show"
                );

                buildQualityMenu();

                video.play().catch(() => {

                    centerPlay.classList.add(
                        "show"
                    );

                    showControls();

                });

            }
        );


        /* --------------------------
           ERRORS
        -------------------------- */

        hls.on(
            Hls.Events.ERROR,
            function(event, data) {

                if (!data.fatal) {
                    return;
                }


                loader.classList.remove(
                    "show"
                );

                errorBox.classList.add(
                    "show"
                );


                setTimeout(() => {

                    errorBox.classList.remove(
                        "show"
                    );

                    startStream();

                }, 3000);

            }
        );

    }

    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = STREAM_URL;

        video.addEventListener(
            "loadedmetadata",
            function() {

                loader.classList.remove(
                    "show"
                );

                video.play().catch(() => {

                    centerPlay.classList.add(
                        "show"
                    );

                    showControls();

                });

            },
            { once: true }
        );

    }

}


/* ==================================
   QUALITY MENU
================================== */

function buildQualityMenu() {

    quality.innerHTML =
        '<option value="-1">Auto</option>';


    if (!hls || !hls.levels.length) {
        return;
    }


    const levels = [...hls.levels];


    levels.forEach(
        (level, index) => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = index;

            option.textContent =
                level.height
                ? level.height + "p"
                : "Quality " + (index + 1);

            quality.appendChild(
                option
            );

        }
    );

}


/* ==================================
   QUALITY CHANGE
================================== */

quality.addEventListener(
    "change",
    function() {

        if (!hls) {
            return;
        }

        hls.currentLevel =
            parseInt(
                this.value
            );

        showControls();

    }
);


/* ==================================
   PLAY / PAUSE
================================== */

function togglePlay() {

    if (video.paused) {

        video.play();

    } else {

        video.pause();

    }

}


playBtn.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();

        togglePlay();

        showControls();

    }
);


centerPlay.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();

        togglePlay();

    }
);


video.addEventListener(
    "play",
    function() {

        playBtn.textContent = "⏸";

        centerPlay.classList.remove(
            "show"
        );

        showControls();

    }
);


video.addEventListener(
    "pause",
    function() {

        playBtn.textContent = "▶";

        centerPlay.classList.add(
            "show"
        );

        showControls();

    }
);


/* ==================================
   MUTE
================================== */

muteBtn.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();

        video.muted =
            !video.muted;

        muteBtn.textContent =
            video.muted
                ? "🔇"
                : "🔊";

        showControls();

    }
);


/* ==================================
   FULLSCREEN
================================== */

fullscreenBtn.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();


        if (!document.fullscreenElement) {

            if (
                player.requestFullscreen
            ) {

                player.requestFullscreen();

            }

        } else {

            document.exitFullscreen();

        }

        showControls();

    }
);


/* ==================================
   LOADING
================================== */

video.addEventListener(
    "waiting",
    function() {

        loader.classList.add(
            "show"
        );

    }
);


video.addEventListener(
    "playing",
    function() {

        loader.classList.remove(
            "show"
        );

        errorBox.classList.remove(
            "show"
        );

        centerPlay.classList.remove(
            "show"
        );

    }
);


/* ==================================
   USER MOVEMENT
================================== */

player.addEventListener(
    "mousemove",
    function() {

        showControls();

    }
);


/* ==================================
   TOUCH
================================== */

player.addEventListener(
    "touchstart",
    function() {

        showControls();

    },
    { passive: true }
);


/* ==================================
   START
================================== */

startStream();

</script>

</body>
</html>
