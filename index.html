<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Live Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

.player{
    position:relative;
    width:100%;
    height:100%;
    background:#000;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

/* Loading */

.loader{
    position:absolute;
    top:50%;
    left:50%;
    width:42px;
    height:42px;
    margin:-21px;
    border:4px solid #ffffff35;
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* Controls */

.controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    padding:45px 14px 12px;

    background:linear-gradient(
        transparent,
        #000e
    );

    opacity:0;
    transition:.25s;

    pointer-events:none;
}

.player.show-controls .controls{
    opacity:1;
    pointer-events:auto;
}

/* Progress */

.progress{
    height:4px;
    background:#ffffff55;
    border-radius:5px;
    cursor:pointer;
    margin-bottom:8px;
    position:relative;
}

.progress-fill{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    width:0;
    background:#ff0033;
    border-radius:5px;
}

/* Row */

.row{
    display:flex;
    align-items:center;
    gap:5px;
}

button{
    width:40px;
    height:40px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:19px;
    border-radius:7px;
}

button:active{
    background:#ffffff20;
}

.spacer{
    flex:1;
}

/* Quality */

select{
    height:38px;
    background:#181818;
    color:#fff;
    border:0;
    border-radius:7px;
    padding:0 9px;
    outline:none;
}

/* Center play */

.center-play{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    width:70px;
    height:70px;

    border-radius:50%;
    border:0;

    background:#fff;
    color:#111;

    font-size:28px;

    display:none;
}

.center-play.show{
    display:block;
}

/* Mobile */

@media(max-width:600px){

    .controls{
        padding:35px 7px 7px;
    }

    button{
        width:35px;
        height:35px;
        font-size:16px;
    }

    select{
        height:35px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<div class="player" id="player">

    <video
        id="video"
        playsinline
        preload="auto">
    </video>

    <div class="loader" id="loader"></div>

    <button
        class="center-play"
        id="centerPlay">
        ▶
    </button>

    <div class="controls">

        <div
            class="progress"
            id="progress">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>

        <div class="row">

            <button id="playBtn">▶</button>

            <button id="muteBtn">🔊</button>

            <select id="quality">
                <option value="-1">Auto</option>
            </select>

            <div class="spacer"></div>

            <button id="fullscreenBtn">⛶</button>

        </div>

    </div>

</div>


<script>

const player =
document.getElementById("player");

const video =
document.getElementById("video");

const loader =
document.getElementById("loader");

const playBtn =
document.getElementById("playBtn");

const muteBtn =
document.getElementById("muteBtn");

const quality =
document.getElementById("quality");

const fullscreenBtn =
document.getElementById("fullscreenBtn");

const centerPlay =
document.getElementById("centerPlay");

const progress =
document.getElementById("progress");

const progressFill =
document.getElementById("progressFill");


/*
=========================================
AUTHORIZED HLS URL
=========================================
*/

const STREAM_URL = "https://propinquitypostulate.website/pl/H4sIAAAAAAAAAwXBx26DMAAA0F8ymBEq5RBaTOvIdlleN4YTCmaISBHw9X2vM6GBXXhpwSNqYXhxTWuA.wjc0IuaALQfGuwnE8.dT5HSQ45ruw40zcsS6aVJX5CVOSXJ6uWTbzsZc1NRv7D4TmRXdBB7JMFnnY4..4oPI3tZV5g0Z54VsFe5_HmzRJ0dj7G2653M2cEkcbmDRv29YjH3nzWyhJa3zVT7IYS2bboeDD1dKvXG_6KZTKvKwB4o8fLIEYEG9mU7OX0looTKxdf2tulxgdXApU6RFRPC9dA7ClhGuU1KiN6_2fX6D4Two9UJAQAA/0f23fcf79be0e63ab6d07c73d2dcf717/index.m3u8?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJteS1hdXRoIiwiaWF0IjoxNzg5MDUzMDA2LCJuYmYiOjE3ODkwNTMwMDYsImV4cCI6MTc4OTA2NzQwNiwiaXBfY2lkciI6IjI0MDk6NDBjMTozMDE0OjQ2Mjo6LzY0In0.Ck8AtN3YnLydoIGp3wAWZvR7yr6Z9NwIpfrxiiutYA4";


let hls = null;
let hideTimer = null;


/*
=========================================
CONTROLS
=========================================
*/

function showControls(){

    player.classList.add("show-controls");

    clearTimeout(hideTimer);

    hideTimer = setTimeout(() => {

        if(!video.paused){

            player.classList.remove(
                "show-controls"
            );

        }

    },5000);
}


function hideControls(){

    player.classList.remove(
        "show-controls"
    );

    clearTimeout(hideTimer);
}


/*
=========================================
QUALITY
=========================================
*/

function makeQualityMenu(){

    quality.innerHTML =
        '<option value="-1">Auto</option>';

    if(!hls || !hls.levels.length){
        return;
    }

    hls.levels.forEach(
        (level,index) => {

            const option =
                document.createElement("option");

            option.value = index;

            option.textContent =
                level.height
                ? level.height + "p"
                : "Quality " + (index+1);

            quality.appendChild(option);

        }
    );
}


quality.addEventListener(
    "change",
    function(){

        if(!hls) return;

        hls.currentLevel =
            Number(this.value);

        showControls();

    }
);


/*
=========================================
START HLS
=========================================
*/

function startPlayer(){

    loader.style.display="block";


    if(Hls.isSupported()){

        hls = new Hls({

            enableWorker:true,

            lowLatencyMode:true,

            backBufferLength:30

        });


        hls.loadSource(STREAM_URL);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                loader.style.display="none";

                makeQualityMenu();

                video.play().catch(() => {

                    centerPlay.classList.add("show");

                    showControls();

                });

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(event,data){

                if(data.fatal){

                    loader.style.display="block";

                    setTimeout(() => {

                        if(hls){
                            hls.destroy();
                        }

                        startPlayer();

                    },3000);

                }

            }
        );

    }

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src = STREAM_URL;

        video.addEventListener(
            "loadedmetadata",
            function(){

                loader.style.display="none";

                video.play().catch(() => {

                    centerPlay.classList.add("show");

                    showControls();

                });

            },
            {once:true}
        );

    }

}


/*
=========================================
PLAY / PAUSE
=========================================
*/

function togglePlay(){

    if(video.paused){

        video.play();

    }else{

        video.pause();

    }

}


playBtn.onclick = function(e){

    e.stopPropagation();

    togglePlay();

    showControls();

};


centerPlay.onclick = function(e){

    e.stopPropagation();

    togglePlay();

};


video.addEventListener(
    "play",
    function(){

        playBtn.textContent="⏸";

        centerPlay.classList.remove("show");

        showControls();

    }
);


video.addEventListener(
    "pause",
    function(){

        playBtn.textContent="▶";

        centerPlay.classList.add("show");

        showControls();

    }
);


/*
=========================================
MUTE
=========================================
*/

muteBtn.onclick = function(e){

    e.stopPropagation();

    video.muted = !video.muted;

    muteBtn.textContent =
        video.muted ? "🔇" : "🔊";

    showControls();

};


/*
=========================================
FULLSCREEN
=========================================
*/

fullscreenBtn.onclick = function(e){

    e.stopPropagation();

    if(!document.fullscreenElement){

        player.requestFullscreen();

    }else{

        document.exitFullscreen();

    }

    showControls();

};


/*
=========================================
PROGRESS
=========================================
*/

video.addEventListener(
    "timeupdate",
    function(){

        if(!video.duration) return;

        const percent =
            (video.currentTime /
             video.duration) * 100;

        progressFill.style.width =
            percent + "%";

    }
);


progress.onclick = function(e){

    if(!video.duration) return;

    const rect =
        progress.getBoundingClientRect();

    const percent =
        (e.clientX - rect.left) /
        rect.width;

    video.currentTime =
        percent * video.duration;

    showControls();

};


/*
=========================================
TAP VIDEO
=========================================
*/

player.addEventListener(
    "click",
    function(e){

        if(
            e.target.closest(".controls") ||
            e.target === centerPlay
        ){
            return;
        }

        if(
            player.classList.contains(
                "show-controls"
            )
        ){

            hideControls();

        }else{

            showControls();

        }

    }
);


/*
=========================================
LOADING
=========================================
*/

video.addEventListener(
    "waiting",
    function(){

        loader.style.display="block";

    }
);


video.addEventListener(
    "playing",
    function(){

        loader.style.display="none";

        centerPlay.classList.remove("show");

    }
);


/*
=========================================
MOUSE / TOUCH
=========================================
*/

player.addEventListener(
    "mousemove",
    showControls
);

player.addEventListener(
    "touchstart",
    showControls,
    {passive:true}
);


/*
=========================================
START
=========================================
*/

startPlayer();

</script>

</body>
</html>
